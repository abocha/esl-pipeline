name: esl-pipeline-smoke

services:
  postgres:
    image: postgres:18.6-alpine
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./packages/batch-backend/schema.sql:/schema/batch-backend/schema.sql:ro
      - ./packages/batch-backend/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: esl
      POSTGRES_PASSWORD: esl
      POSTGRES_DB: esl_smoke
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U esl -d esl_smoke']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.10.2-alpine3.23
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:56379:6379'
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
  redis_data:
