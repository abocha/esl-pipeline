name: ${COMPOSE_PROJECT_NAME:-esl-pipeline-prod}

services:
  batch-backend:
    build:
      context: .
      dockerfile: packages/batch-backend/Dockerfile
      tags:
        - esl-pipeline/batch-backend:local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - type: bind
        source: ./uploads
        target: /app/uploads
        bind:
          create_host_path: false
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      NODE_ENV: production
      PIPELINE_CWD: /app
      FILESYSTEM_UPLOAD_DIR: /app/uploads
      PG_BACKUP_ENV_FILE: /dev/null
      PG_CONTAINER_NAME: ${COMPOSE_PROJECT_NAME:-esl-pipeline-prod}-postgres-1
      PG_BACKUP_RESTORE_DRILL_REPORT_LATEST: /app/tmp/logs/backup/restore-drill-report-latest.json
    env_file:
      - .env.batch-backend
    ports:
      - '127.0.0.1:${BATCH_BACKEND_HOST_PORT:-8080}:8080'
    restart: unless-stopped

  batch-frontend:
    build:
      context: .
      dockerfile: packages/batch-frontend/Dockerfile
      tags:
        - esl-pipeline/batch-frontend:local
    depends_on:
      - batch-backend
    ports:
      - '0.0.0.0:${BATCH_FRONTEND_HOST_PORT:-5173}:80'
    restart: unless-stopped

  batch-worker:
    image: esl-pipeline/batch-backend:local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - type: bind
        source: ./uploads
        target: /app/uploads
        bind:
          create_host_path: false
    environment:
      NODE_ENV: production
      PIPELINE_CWD: /app
      FILESYSTEM_UPLOAD_DIR: /app/uploads
    env_file:
      - .env.batch-backend
    command: [ 'node', 'dist/transport/worker-runner.js' ]
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    # Persistent DB (named volume).
    volumes:
      - postgres18_data:/var/lib/postgresql
      - ./packages/batch-backend/schema.sql:/schema/batch-backend/schema.sql:ro
      - ./packages/batch-backend/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: esl
      POSTGRES_PASSWORD: esl
      POSTGRES_DB: esl_batch
    ports:
      - '127.0.0.1:5432:5432'
    command: [ 'postgres', '-c', 'fsync=off', '-c', 'listen_addresses=*' ]
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U esl -d esl_batch' ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6379:6379'
    command: [ 'redis-server', '--save', '', '--appendonly', 'no' ]
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 5s
      timeout: 3s
      retries: 10

  telegram-ops-bot:
    build:
      context: .
      dockerfile: packages/telegram-ops-bot/Dockerfile
      tags:
        - esl-pipeline/telegram-ops-bot:local
    depends_on:
      - batch-backend
    env_file:
      - .env.batch-backend
    restart: unless-stopped

volumes:
  postgres18_data:
  redis_data:
