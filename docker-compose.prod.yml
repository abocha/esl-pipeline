name: ${COMPOSE_PROJECT_NAME:-esl-pipeline-prod}

services:
  batch-backend:
    image: ${BATCH_BACKEND_IMAGE:?Set BATCH_BACKEND_IMAGE to a GHCR image reference tagged with the deployed Git SHA}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - type: bind
        source: ./uploads
        target: /app/uploads
        bind:
          create_host_path: false
    environment:
      NODE_ENV: production
      PIPELINE_CWD: /app
      FILESYSTEM_UPLOAD_DIR: /app/uploads
      PG_BACKUP_ENV_FILE: /dev/null
      PG_CONTAINER_NAME: ${COMPOSE_PROJECT_NAME:-esl-pipeline-prod}-postgres-1
      PG_BACKUP_RESTORE_DRILL_REPORT_LATEST: /app/tmp/logs/backup/restore-drill-report-latest.json
      PG_APPLICATION_NAME: esl-pipeline-api
      PG_POOL_MAX: '8'
      BATCH_BACKEND_ENABLE_OPS_CONTROL: ${BATCH_BACKEND_ENABLE_OPS_CONTROL:-false}
    env_file:
      - .env.batch-backend
    ports:
      - '127.0.0.1:${BATCH_BACKEND_HOST_PORT:-8080}:8080'
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8080/health >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  batch-frontend:
    image: ${BATCH_FRONTEND_IMAGE:?Set BATCH_FRONTEND_IMAGE to a GHCR image reference tagged with the deployed Git SHA}
    depends_on:
      - batch-backend
    ports:
      - target: 8080
        published: ${BATCH_FRONTEND_HOST_PORT:-5173}
        host_ip: ${BATCH_FRONTEND_BIND_ADDR:-127.0.0.1}
    restart: unless-stopped

  batch-worker:
    image: ${BATCH_BACKEND_IMAGE:?Set BATCH_BACKEND_IMAGE to a GHCR image reference tagged with the deployed Git SHA}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - type: bind
        source: ./uploads
        target: /app/uploads
        bind:
          create_host_path: false
    environment:
      NODE_ENV: production
      PIPELINE_CWD: /app
      FILESYSTEM_UPLOAD_DIR: /app/uploads
      PG_APPLICATION_NAME: esl-pipeline-batch-worker
      PG_POOL_MAX: '6'
    env_file:
      - .env.batch-backend
    command: ['node', 'dist/transport/worker-runner.js']
    restart: unless-stopped

  caddy-edge:
    image: caddy:2-alpine
    depends_on:
      - batch-frontend
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      CADDY_PUBLIC_HOSTNAME: ${CADDY_PUBLIC_HOSTNAME:-}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-}
    ports:
      - '0.0.0.0:80:80'
      - '0.0.0.0:443:443'
    restart: unless-stopped
    profiles:
      - edge

  postgres:
    image: postgres:18.4-alpine
    # Persistent DB (named volume).
    volumes:
      - postgres18_data:/var/lib/postgresql
      - ./packages/batch-backend/schema.sql:/schema/batch-backend/schema.sql:ro
      - ./packages/batch-backend/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: esl
      POSTGRES_PASSWORD: esl
      POSTGRES_DB: esl_batch
    ports:
      - '127.0.0.1:5432:5432'
    command:
      [
        'postgres',
        '-c',
        'fsync=on',
        '-c',
        'synchronous_commit=on',
        '-c',
        'wal_compression=on',
        '-c',
        'shared_preload_libraries=pg_stat_statements',
        '-c',
        'compute_query_id=on',
        '-c',
        'pg_stat_statements.max=10000',
        '-c',
        'track_io_timing=on',
        '-c',
        'log_lock_waits=on',
        '-c',
        'idle_in_transaction_session_timeout=60s',
        '-c',
        'listen_addresses=*',
      ]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U esl -d esl_batch']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.6.3-alpine
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6379:6379'
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--maxmemory-policy',
        'noeviction',
        '--latency-monitor-threshold',
        '100',
      ]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  telegram-ops-bot:
    image: ${TELEGRAM_OPS_BOT_IMAGE:-ghcr.io/abocha/esl-pipeline/telegram-ops-bot:disabled}
    depends_on:
      - batch-backend
    environment:
      PG_APPLICATION_NAME: esl-pipeline-telegram-ops-bot
      PG_POOL_MAX: '2'
    env_file:
      - .env.batch-backend
    restart: unless-stopped
    profiles:
      - ops-bot

  transcribe-worker:
    image: ${BATCH_BACKEND_IMAGE:?Set BATCH_BACKEND_IMAGE to a GHCR image reference tagged with the deployed Git SHA}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - type: bind
        source: ./uploads
        target: /app/uploads
        bind:
          create_host_path: false
    environment:
      NODE_ENV: production
      PIPELINE_CWD: /app
      FILESYSTEM_UPLOAD_DIR: /app/uploads
      PG_APPLICATION_NAME: esl-pipeline-transcribe-worker
      PG_POOL_MAX: '4'
    env_file:
      - .env.batch-backend
    command: ['node', 'dist/transport/transcribe-worker.js']
    restart: unless-stopped

volumes:
  caddy_config:
  caddy_data:
  postgres18_data:
  redis_data:
