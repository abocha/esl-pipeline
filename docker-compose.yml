name: ${COMPOSE_PROJECT_NAME:-esl-pipeline}

services:
  batch-backend:
    image: esl-pipeline/dev-node-ops:local
    build:
      context: .
      dockerfile: packages/batch-backend/Dockerfile.dev
      target: ops
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes: *dev_backend_workspace_volumes
    environment:
      NODE_ENV: development
      PIPELINE_CWD: /app
      FILESYSTEM_UPLOAD_DIR: /app/uploads
      PG_BACKUP_ENV_FILE: /dev/null
      PG_CONTAINER_NAME: ${COMPOSE_PROJECT_NAME:-esl-pipeline}-postgres-1
      PG_APPLICATION_NAME: esl-pipeline-api
      PG_POOL_MAX: '8'
      PNPM_CONFIG_INJECT_WORKSPACE_PACKAGES: 'false'
      PNPM_STORE_DIR: /pnpm/store
      NPM_CONFIG_STORE_DIR: /pnpm/store
    env_file:
      - .env
    ports:
      - '127.0.0.1:${BATCH_BACKEND_HOST_PORT:-8080}:8080'
    command: >
      sh -lc "
        pnpm --filter @esl-pipeline/batch-backend dev:api
      "
    user: '${UID:-1000}:${GID:-1000}'
    group_add:
      - '${DOCKER_GID:-1001}'
    pull_policy: never

  batch-frontend:
    image: esl-pipeline/batch-frontend:dev-local
    build:
      context: .
      dockerfile: packages/batch-frontend/Dockerfile.dev
    depends_on:
      deps:
        condition: service_completed_successfully
    volumes: *dev_workspace_volumes
    environment:
      NODE_ENV: development
      BATCH_BACKEND_URL: http://batch-backend:8080
      PNPM_CONFIG_INJECT_WORKSPACE_PACKAGES: 'false'
      PNPM_STORE_DIR: /pnpm/store
      NPM_CONFIG_STORE_DIR: /pnpm/store
    ports:
      - '0.0.0.0:${BATCH_FRONTEND_HOST_PORT:-5173}:5173'
    command: >
      sh -lc "
        pnpm --filter @esl-pipeline/batch-frontend dev --host 0.0.0.0
      "
    user: '${UID:-1000}:${GID:-1000}'
    pull_policy: never

  batch-worker:
    image: esl-pipeline/dev-node-base:local
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes: *dev_upload_workspace_volumes
    environment:
      NODE_ENV: development
      PIPELINE_CWD: /app
      FILESYSTEM_UPLOAD_DIR: /app/uploads
      PG_APPLICATION_NAME: esl-pipeline-batch-worker
      PG_POOL_MAX: '6'
      PNPM_CONFIG_INJECT_WORKSPACE_PACKAGES: 'false'
      PNPM_STORE_DIR: /pnpm/store
      NPM_CONFIG_STORE_DIR: /pnpm/store
    env_file:
      - .env
    command: >
      sh -lc "
        pnpm --filter @esl-pipeline/batch-backend dev:worker
      "
    user: '${UID:-1000}:${GID:-1000}'
    pull_policy: never

  deps:
    image: esl-pipeline/dev-node-base:local
    build:
      context: .
      dockerfile: packages/batch-backend/Dockerfile.dev
      target: default
    volumes: *dev_workspace_volumes
    environment:
      CI: 'true'
      PNPM_CONFIG_INJECT_WORKSPACE_PACKAGES: 'false'
      PNPM_STORE_DIR: /pnpm/store
      NPM_CONFIG_STORE_DIR: /pnpm/store
    command: >
      sh -lc "
        dependency_paths='/app/node_modules /app/packages/batch-backend/node_modules /app/packages/batch-frontend/node_modules /app/packages/contracts/node_modules /app/packages/html-publisher/node_modules /app/packages/orchestrator/node_modules /app/packages/provider-runtime/node_modules /app/packages/shared-infrastructure/node_modules /app/packages/storage-uploader/node_modules /app/packages/stt-core/node_modules /app/packages/stt-provider-deepgram/node_modules /app/packages/stt-provider-elevenlabs/node_modules /app/packages/stt-provider-google/node_modules /app/packages/telegram-ops-bot/node_modules /app/packages/tts-core/node_modules /app/packages/tts-provider-elevenlabs/node_modules /app/packages/tts-provider-google/node_modules /app/packages/tts-provider-inworld/node_modules /app/packages/orchestrator/examples/service/node_modules /pnpm' &&
        mkdir -p $$dependency_paths /pnpm/store &&
        chmod -R 0777 $$dependency_paths &&
        pnpm install --no-frozen-lockfile &&
        pnpm -r --filter './packages/*' run build &&
        find /app/packages -mindepth 2 -maxdepth 2 -type d -name dist -exec chown -R ${UID:-1000}:${GID:-1000} {} \\; &&
        chown -R ${UID:-1000}:${GID:-1000} $$dependency_paths
      "
    working_dir: /app
    user: '0:0'
    pull_policy: never
  postgres:
    image: postgres:18.6-alpine
    # Persistent DB (named volume).
    volumes:
      - postgres18_data:/var/lib/postgresql
      - ./packages/batch-backend/schema.sql:/schema/batch-backend/schema.sql:ro
      - ./packages/batch-backend/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: esl
      POSTGRES_PASSWORD: esl
      POSTGRES_DB: esl_batch
    ports:
      - '127.0.0.1:5432:5432'
    command:
      [
        'postgres',
        '-c',
        'fsync=on',
        '-c',
        'shared_preload_libraries=pg_stat_statements',
        '-c',
        'compute_query_id=on',
        '-c',
        'pg_stat_statements.max=10000',
        '-c',
        'track_io_timing=on',
        '-c',
        'log_lock_waits=on',
        '-c',
        'idle_in_transaction_session_timeout=60s',
        '-c',
        'listen_addresses=*',
      ]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U esl -d esl_batch']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.2-alpine3.23
    # Persistent data (named volume).
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6380:6379'
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory-policy',
        'noeviction',
        '--latency-monitor-threshold',
        '100',
      ]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  student-memory-worker:
    image: esl-pipeline/dev-node-base:local
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes: *dev_upload_workspace_volumes
    environment:
      NODE_ENV: development
      PIPELINE_CWD: /app
      FILESYSTEM_UPLOAD_DIR: /app/uploads
      PG_APPLICATION_NAME: esl-pipeline-student-memory-worker
      PG_POOL_MAX: '4'
      PNPM_CONFIG_INJECT_WORKSPACE_PACKAGES: 'false'
      PNPM_STORE_DIR: /pnpm/store
      NPM_CONFIG_STORE_DIR: /pnpm/store
    env_file:
      - .env
    command: >
      sh -lc "
        pnpm --filter @esl-pipeline/batch-backend dev:student-memory-worker
      "
    user: '${UID:-1000}:${GID:-1000}'
    pull_policy: never

  telegram-ops-bot:
    image: esl-pipeline/dev-node-base:local
    depends_on:
      batch-backend:
        condition: service_started
      deps:
        condition: service_completed_successfully
    volumes: *dev_workspace_volumes
    environment:
      NODE_ENV: development
      PG_APPLICATION_NAME: esl-pipeline-telegram-ops-bot
      PG_POOL_MAX: '2'
      PNPM_CONFIG_INJECT_WORKSPACE_PACKAGES: 'false'
      PNPM_STORE_DIR: /pnpm/store
      NPM_CONFIG_STORE_DIR: /pnpm/store
    env_file:
      - .env
    command: >
      sh -lc "
        pnpm --filter @esl-pipeline/telegram-ops-bot dev
      "
    user: '${UID:-1000}:${GID:-1000}'
    pull_policy: never

  telegram-ops-bot-smoke:
    image: esl-pipeline/dev-node-base:local
    depends_on:
      telegram-smoke-api:
        condition: service_healthy
      telegram-smoke-backend:
        condition: service_healthy
      telegram-smoke-deps:
        condition: service_completed_successfully
    volumes: *dev_workspace_volumes
    environment:
      NODE_ENV: development
      PNPM_CONFIG_INJECT_WORKSPACE_PACKAGES: 'false'
      PNPM_STORE_DIR: /pnpm/store
      NPM_CONFIG_STORE_DIR: /pnpm/store
      TELEGRAM_OPS_BOT_ENABLED: 'true'
      TELEGRAM_OPS_BOT_TOKEN: '${TELEGRAM_SMOKE_BOT_TOKEN:-123456789:smoke-token}'
      TELEGRAM_OPS_BOT_CHAT_ID: '${TELEGRAM_SMOKE_CHAT_ID:--1001234567890}'
      TELEGRAM_OPS_BOT_ALLOWED_USER_IDS: '${TELEGRAM_SMOKE_ALLOWED_USER_ID:-12345678}'
      TELEGRAM_OPS_BOT_API_BASE_URL: 'http://telegram-smoke-api:18080'
      TELEGRAM_OPS_BOT_MODE: 'polling'
      TELEGRAM_OPS_BOT_LEADER_ELECTION_ENABLED: 'false'
      TELEGRAM_OPS_BOT_BACKEND_URL: 'http://telegram-smoke-backend:18081'
      TELEGRAM_OPS_BOT_BACKEND_EMAIL: '${TELEGRAM_SMOKE_BACKEND_EMAIL:-ops-bot@example.com}'
      TELEGRAM_OPS_BOT_BACKEND_PASSWORD: '${TELEGRAM_SMOKE_BACKEND_PASSWORD:-smoke-password}'
      TELEGRAM_OPS_BOT_BACKEND_TIMEOUT_MS: '5000'
      TELEGRAM_OPS_BOT_BACKEND_SHARED_SECRET: '${TELEGRAM_SMOKE_BACKEND_SECRET:-smoke-secret}'
      TELEGRAM_OPS_BOT_POLL_INTERVAL_MS: '250'
      TELEGRAM_OPS_BOT_POLL_TIMEOUT_SECONDS: '1'
      TELEGRAM_OPS_BOT_COMMAND_WINDOW_MS: '60000'
      TELEGRAM_OPS_BOT_MAX_COMMANDS_PER_WINDOW: '20'
      TELEGRAM_OPS_BOT_ENABLE_ACTION_COMMANDS: 'false'
      TELEGRAM_OPS_BOT_SKIP_PENDING_UPDATES_ON_STARTUP: 'true'
      TELEGRAM_OPS_BOT_TOPIC_AUTO_CREATE: 'true'
      TELEGRAM_OPS_BOT_TOPICS_STATE_FILE: '/tmp/telegram-ops-topics-smoke.json'
      TELEGRAM_OPS_BOT_TOPIC_NAME_OPS: 'Ops Control'
      TELEGRAM_OPS_BOT_TOPIC_NAME_JOBS: 'Jobs'
      TELEGRAM_OPS_BOT_TOPIC_NAME_ALERTS: 'Alerts'
      TELEGRAM_OPS_BOT_APP_BASE_URL: 'https://batch-smoke.example.com'
    command: >
      sh -lc "
        pnpm --filter @esl-pipeline/telegram-ops-bot dev
      "
    user: '${UID:-1000}:${GID:-1000}'
    profiles: ['telegram-smoke']
    pull_policy: never

  telegram-smoke-api:
    image: node:24-bookworm-slim
    volumes:
      - ./:/app:ro
    environment:
      TELEGRAM_SMOKE_TOKEN: '${TELEGRAM_SMOKE_BOT_TOKEN:-123456789:smoke-token}'
      TELEGRAM_SMOKE_CHAT_ID: '${TELEGRAM_SMOKE_CHAT_ID:--1001234567890}'
      TELEGRAM_SMOKE_ALLOWED_USER_ID: '${TELEGRAM_SMOKE_ALLOWED_USER_ID:-12345678}'
      TELEGRAM_SMOKE_API_HOST: '0.0.0.0'
      TELEGRAM_SMOKE_API_PORT: '18080'
    ports:
      - '127.0.0.1:${TELEGRAM_SMOKE_API_HOST_PORT:-18080}:18080'
    command: >
      sh -lc "
        node scripts/smoke/telegram-ops/fake-telegram-api.mjs
      "
    working_dir: /app
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:18080/_health'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 2s
      timeout: 2s
      retries: 20
    profiles: ['telegram-smoke']

  telegram-smoke-backend:
    image: node:24-bookworm-slim
    volumes:
      - ./:/app:ro
    environment:
      TELEGRAM_SMOKE_BACKEND_HOST: '0.0.0.0'
      TELEGRAM_SMOKE_BACKEND_PORT: '18081'
      TELEGRAM_SMOKE_BACKEND_SECRET: '${TELEGRAM_SMOKE_BACKEND_SECRET:-smoke-secret}'
      TELEGRAM_SMOKE_BACKEND_EMAIL: '${TELEGRAM_SMOKE_BACKEND_EMAIL:-ops-bot@example.com}'
      TELEGRAM_SMOKE_BACKEND_PASSWORD: '${TELEGRAM_SMOKE_BACKEND_PASSWORD:-smoke-password}'
      TELEGRAM_SMOKE_SHARE_JOB_ID: '${TELEGRAM_SMOKE_SHARE_JOB_ID:-job-smoke-1}'
    ports:
      - '127.0.0.1:${TELEGRAM_SMOKE_BACKEND_HOST_PORT:-18081}:18081'
    command: >
      sh -lc "
        node scripts/smoke/telegram-ops/fake-backend.mjs
      "
    working_dir: /app
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:18081/_health'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 2s
      timeout: 2s
      retries: 20
    profiles: ['telegram-smoke']

  telegram-smoke-deps:
    image: esl-pipeline/dev-node-base:local
    build:
      context: .
      dockerfile: packages/batch-backend/Dockerfile.dev
      target: default
    volumes: *dev_workspace_volumes
    environment:
      PNPM_CONFIG_INJECT_WORKSPACE_PACKAGES: 'false'
      PNPM_STORE_DIR: /pnpm/store
      NPM_CONFIG_STORE_DIR: /pnpm/store
      CI: 'false'
    # Development uses live workspace symlinks: post-build injection cannot
    # hardlink files between the source bind mount and node_modules volumes.
    command: >
      sh -lc "
        dependency_paths='/app/node_modules /app/packages/batch-backend/node_modules /app/packages/batch-frontend/node_modules /app/packages/contracts/node_modules /app/packages/html-publisher/node_modules /app/packages/orchestrator/node_modules /app/packages/provider-runtime/node_modules /app/packages/shared-infrastructure/node_modules /app/packages/storage-uploader/node_modules /app/packages/stt-core/node_modules /app/packages/stt-provider-deepgram/node_modules /app/packages/stt-provider-elevenlabs/node_modules /app/packages/stt-provider-google/node_modules /app/packages/telegram-ops-bot/node_modules /app/packages/tts-core/node_modules /app/packages/tts-provider-elevenlabs/node_modules /app/packages/tts-provider-google/node_modules /app/packages/tts-provider-inworld/node_modules /app/packages/orchestrator/examples/service/node_modules /pnpm' &&
        mkdir -p $$dependency_paths /pnpm/store &&
        chmod -R 0777 $$dependency_paths &&
        pnpm install --no-frozen-lockfile &&
        pnpm --filter @esl-pipeline/telegram-ops-bot... run build &&
        chown -R ${UID:-1000}:${GID:-1000} $$dependency_paths /app/packages/contracts/dist /app/packages/shared-infrastructure/dist /app/packages/telegram-ops-bot/dist
      "
    working_dir: /app
    user: '0:0'
    profiles: ['telegram-smoke']
    pull_policy: never

  tools:
    image: esl-pipeline/dev-node-tools:local
    build:
      context: .
      dockerfile: packages/batch-backend/Dockerfile.dev
      target: tools
    depends_on:
      deps:
        condition: service_completed_successfully
    volumes: *dev_workspace_volumes
    environment:
      NODE_ENV: development
      PNPM_CONFIG_INJECT_WORKSPACE_PACKAGES: 'false'
      PNPM_STORE_DIR: /pnpm/store
      NPM_CONFIG_STORE_DIR: /pnpm/store
    command: >
      sh -lc "
        sleep infinity
      "
    user: '${UID:-1000}:${GID:-1000}'
    profiles: ['tools']
    pull_policy: never

  transcribe-worker:
    image: esl-pipeline/dev-node-base:local
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes: *dev_upload_workspace_volumes
    environment:
      NODE_ENV: development
      PIPELINE_CWD: /app
      FILESYSTEM_UPLOAD_DIR: /app/uploads
      PG_APPLICATION_NAME: esl-pipeline-transcribe-worker
      PG_POOL_MAX: '4'
      PNPM_CONFIG_INJECT_WORKSPACE_PACKAGES: 'false'
      PNPM_STORE_DIR: /pnpm/store
      NPM_CONFIG_STORE_DIR: /pnpm/store
    env_file:
      - .env
    command: >
      sh -lc "
        pnpm --filter @esl-pipeline/batch-backend dev:transcribe-worker
      "
    user: '${UID:-1000}:${GID:-1000}'
    pull_policy: never

volumes:
  example_orchestrator_service_node_modules:
  pkg_batch_backend_node_modules:
  pkg_batch_frontend_node_modules:
  pkg_contracts_node_modules:
  pkg_html_publisher_node_modules:
  pkg_orchestrator_node_modules:
  pkg_provider_runtime_node_modules:
  pkg_shared_infrastructure_node_modules:
  pkg_storage_uploader_node_modules:
  pkg_stt_core_node_modules:
  pkg_stt_provider_deepgram_node_modules:
  pkg_stt_provider_elevenlabs_node_modules:
  pkg_stt_provider_google_node_modules:
  pkg_telegram_ops_bot_node_modules:
  pkg_tts_core_node_modules:
  pkg_tts_provider_elevenlabs_node_modules:
  pkg_tts_provider_google_node_modules:
  pkg_tts_provider_inworld_node_modules:
  postgres18_data:
  redis_data:
  workspace_node_modules:
  workspace_pnpm_store:
