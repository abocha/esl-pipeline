name: esl-pipeline-dev

services:
  batch-backend:
    image: esl-pipeline/dev-node:local
    container_name: esl-batch-backend
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - type: bind
        source: ./uploads
        target: /app/uploads
        bind:
          create_host_path: false
      - ./:/app
      - workspace_node_modules:/app/node_modules
      - workspace_pnpm_store:/pnpm
    environment:
      NODE_ENV: development
      PIPELINE_CWD: /app
      FILESYSTEM_UPLOAD_DIR: /app/uploads
      PNPM_STORE_DIR: /pnpm/store
      NPM_CONFIG_STORE_DIR: /pnpm/store
    env_file:
      - .env.batch-backend
    ports:
      - '127.0.0.1:8080:8080'
    command: >
      sh -lc "
        pnpm --filter @esl-pipeline/batch-backend dev:api
      "
    user: '${UID:-1000}:${GID:-1000}'
    pull_policy: never

  batch-frontend:
    image: esl-pipeline/batch-frontend:dev-local
    build:
      context: .
      dockerfile: packages/batch-frontend/Dockerfile.dev
    container_name: esl-batch-frontend
    depends_on:
      deps:
        condition: service_completed_successfully
    volumes:
      - ./:/app
      - workspace_node_modules:/app/node_modules
      - workspace_pnpm_store:/pnpm
    environment:
      NODE_ENV: development
      BATCH_BACKEND_URL: http://batch-backend:8080
      PNPM_STORE_DIR: /pnpm/store
      NPM_CONFIG_STORE_DIR: /pnpm/store
    ports:
      - '0.0.0.0:5173:5173'
    command: >
      sh -lc "
        pnpm --filter @esl-pipeline/batch-frontend dev --host 0.0.0.0
      "
    user: '${UID:-1000}:${GID:-1000}'
    pull_policy: never

  batch-worker:
    image: esl-pipeline/dev-node:local
    container_name: esl-batch-worker
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - type: bind
        source: ./uploads
        target: /app/uploads
        bind:
          create_host_path: false
      - ./:/app
      - workspace_node_modules:/app/node_modules
      - workspace_pnpm_store:/pnpm
    environment:
      NODE_ENV: development
      PIPELINE_CWD: /app
      FILESYSTEM_UPLOAD_DIR: /app/uploads
      PNPM_STORE_DIR: /pnpm/store
      NPM_CONFIG_STORE_DIR: /pnpm/store
    env_file:
      - .env.batch-backend
    command: >
      sh -lc "
        pnpm --filter @esl-pipeline/batch-backend dev:worker
      "
    user: '${UID:-1000}:${GID:-1000}'
    pull_policy: never

  deps:
    image: esl-pipeline/dev-node:local
    build:
      context: .
      dockerfile: packages/batch-backend/Dockerfile.dev
    container_name: esl-dev-deps
    volumes:
      - ./:/app
      - workspace_node_modules:/app/node_modules
      - workspace_pnpm_store:/pnpm
    environment:
      CI: 'true'
      PNPM_STORE_DIR: /pnpm/store
      NPM_CONFIG_STORE_DIR: /pnpm/store
    command: >
      sh -lc "
        mkdir -p /app/node_modules /pnpm/store &&
        chmod -R 0777 /app/node_modules /pnpm &&
        pnpm install &&
        pnpm -r --filter './packages/*' run build &&
        chown -R ${UID:-1000}:${GID:-1000} /app/node_modules /pnpm
      "
    working_dir: /app
    user: '0:0'
    pull_policy: never
  postgres:
    image: postgres:18-alpine
    container_name: esl-backend-postgres
    # Persistent DB (named volume).
    volumes:
      - postgres18_data:/var/lib/postgresql
      - ./packages/batch-backend/schema.sql:/schema/batch-backend/schema.sql:ro
      - ./packages/batch-backend/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: esl
      POSTGRES_PASSWORD: esl
      POSTGRES_DB: esl_batch
    ports:
      - '127.0.0.1:5432:5432'
    command: [ 'postgres', '-c', 'fsync=off', '-c', 'listen_addresses=*' ]
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U esl -d esl_batch' ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:alpine
    container_name: esl-backend-redis
    # Persistent data (named volume).
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6379:6379'
    command: [ 'redis-server', '--save', '', '--appendonly', 'no' ]
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 5s
      timeout: 3s
      retries: 10

  transcribe-worker:
    image: esl-pipeline/dev-node:local
    container_name: esl-transcribe-worker
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - type: bind
        source: ./uploads
        target: /app/uploads
        bind:
          create_host_path: false
      - ./:/app
      - workspace_node_modules:/app/node_modules
      - workspace_pnpm_store:/pnpm
    environment:
      NODE_ENV: development
      PIPELINE_CWD: /app
      FILESYSTEM_UPLOAD_DIR: /app/uploads
      PNPM_STORE_DIR: /pnpm/store
      NPM_CONFIG_STORE_DIR: /pnpm/store
    env_file:
      - .env.batch-backend
    command: >
      sh -lc "
        pnpm --filter @esl-pipeline/batch-backend exec tsx watch src/transport/transcribe-worker.ts
      "
    user: '${UID:-1000}:${GID:-1000}'
    pull_policy: never

volumes:
  postgres_data:
  postgres18_data:
  redis_data:
  workspace_node_modules:
  workspace_pnpm_store:
