services:
  postgres:
    image: postgres:18-alpine
    container_name: esl-backend-postgres
    environment:
      POSTGRES_USER: esl
      POSTGRES_PASSWORD: esl
      POSTGRES_DB: esl_batch
    command: ['postgres', '-c', 'fsync=off', '-c', 'listen_addresses=*']
    ports:
      - '5432:5432'
    # Persistent DB (named volume).
    volumes:
      - postgres18_data:/var/lib/postgresql
      - ./packages/batch-backend/schema.sql:/schema/batch-backend/schema.sql:ro
      - ./packages/batch-backend/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U esl -d esl_batch']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:alpine
    container_name: esl-backend-redis
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6379:6379'
    # Persistent data (named volume).
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  deps:
    build:
      context: .
      dockerfile: packages/batch-backend/Dockerfile.dev
    image: esl-pipeline/dev-node:local
    pull_policy: never
    container_name: esl-dev-deps
    user: '${UID:-1000}:${GID:-1000}'
    working_dir: /app
    environment:
      CI: 'true'
    volumes:
      - ./:/app
      - type: bind
        source: ./.pnpm-store
        target: /pnpm/store
        bind:
          create_host_path: false
    command: >
      sh -lc "
        pnpm install &&
        pnpm -r --filter './packages/*' run build
      "

  batch-backend:
    image: esl-pipeline/dev-node:local
    pull_policy: never
    container_name: esl-batch-backend
    user: '${UID:-1000}:${GID:-1000}'
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env.batch-backend
    environment:
      NODE_ENV: development
      PIPELINE_CWD: /app
      FILESYSTEM_UPLOAD_DIR: /app/uploads
    volumes:
      - type: bind
        source: ./uploads
        target: /app/uploads
        bind:
          create_host_path: false
      - ./:/app
    command: >
      sh -lc "
        pnpm --filter @esl-pipeline/batch-backend dev:api
      "
    ports:
      - '8080:8080'

  batch-worker:
    image: esl-pipeline/dev-node:local
    pull_policy: never
    container_name: esl-batch-worker
    user: '${UID:-1000}:${GID:-1000}'
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env.batch-backend
    environment:
      NODE_ENV: development
      PIPELINE_CWD: /app
      FILESYSTEM_UPLOAD_DIR: /app/uploads
    volumes:
      - type: bind
        source: ./uploads
        target: /app/uploads
        bind:
          create_host_path: false
      - ./:/app
    command: >
      sh -lc "
        pnpm --filter @esl-pipeline/batch-backend dev:worker
      "

  transcribe-worker:
    image: esl-pipeline/dev-node:local
    pull_policy: never
    container_name: esl-transcribe-worker
    user: '${UID:-1000}:${GID:-1000}'
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env.batch-backend
    environment:
      NODE_ENV: development
      PIPELINE_CWD: /app
      FILESYSTEM_UPLOAD_DIR: /app/uploads
    volumes:
      - type: bind
        source: ./uploads
        target: /app/uploads
        bind:
          create_host_path: false
      - ./:/app
    command: >
      sh -lc "
        pnpm --filter @esl-pipeline/batch-backend exec tsx watch src/transport/transcribe-worker.ts
      "

  batch-frontend:
    build:
      context: .
      dockerfile: packages/batch-frontend/Dockerfile.dev
    image: esl-pipeline/batch-frontend:dev
    pull_policy: never
    container_name: esl-batch-frontend
    user: '${UID:-1000}:${GID:-1000}'
    depends_on:
      deps:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      BATCH_BACKEND_URL: http://batch-backend:8080
    volumes:
      - ./:/app
      - type: bind
        source: ./.pnpm-store
        target: /pnpm/store
        bind:
          create_host_path: false
    command: >
      sh -lc "
        pnpm --filter @esl-pipeline/batch-frontend dev --host 0.0.0.0
      "
    ports:
      - '5173:5173'

volumes:
  postgres_data:
  postgres18_data:
  redis_data:
