map $http_x_forwarded_proto $pipeline_external_proto {
  default $scheme;
  https https;
}

server {
  listen 8080;
  server_name _;
  client_max_body_size 120m;
  resolver 127.0.0.11 ipv6=off valid=30s;

  root /usr/share/nginx/html;
  index index.html;

  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    set $backend_request_uri $request_uri;
    if ($backend_request_uri ~ ^/api/(.*)$) {
      set $backend_request_uri /$1;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Caddy sets the external scheme; nginx receives HTTP on the private hop.
    proxy_set_header X-Forwarded-Proto $pipeline_external_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    proxy_pass http://batch-backend:8080$backend_request_uri;
  }
}
