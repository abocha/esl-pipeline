worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Raw diagnostics include the request line before location matching (including malformed URLs).
  # Keep outcomes observable through this allowlisted format; never emit queries or headers.
  map $uri $pipeline_log_route {
    default http;
    ~*^/api/google/calendar google_calendar_callback;
  }
  log_format pipeline_safe escape=json '{"route":"$pipeline_log_route","method":"$request_method","status":$status,"requestId":"$request_id"}';
  access_log /dev/stdout pipeline_safe;
  error_log /dev/null crit;

  sendfile on;
  keepalive_timeout 65;

  client_body_temp_path /tmp/nginx/client_temp;
  proxy_temp_path /tmp/nginx/proxy_temp;
  fastcgi_temp_path /tmp/nginx/fastcgi_temp;
  uwsgi_temp_path /tmp/nginx/uwsgi_temp;
  scgi_temp_path /tmp/nginx/scgi_temp;

  include /etc/nginx/conf.d/*.conf;
}
