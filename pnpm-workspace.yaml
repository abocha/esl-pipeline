packages:
  - packages/*
  - packages/orchestrator/examples/*

injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

storeDir: .pnpm-store/v11

overrides:
  '@tootallnate/once': ^3.0.1
  'ajv@>=8.0.0 <8.18.0': ^8.18.0
  esbuild: ^0.28.1
  fast-uri: ^3.1.5
  fast-xml-builder: ^1.2.0
  fast-xml-parser: ^5.5.8
  ioredis: ^6.0.0
  minimatch: ^10.2.4
  rollup: ^4.59.0
  undici: ^7.29.0
  uuid: ^11.1.1
  yaml: ^2.8.3

# The published cookie types import Fastify but omit it from package metadata.
# Keep the type augmentation attached to the backend's Fastify identity under pnpm's isolated linker.
packageExtensions:
  '@fastify/cookie@11.1.2':
    peerDependencies:
      fastify: ^5.12.3

allowBuilds:
  '@swc/core': true
  bcrypt: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - undici@7.29.0
  - '@types/node@24.13.4'
