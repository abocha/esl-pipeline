name: Release Label Guard

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-label-guard-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-release-label:
    name: validate release bump label
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Collect release policy file records
        if: contains(github.event.pull_request.labels.*.name, 'release:none')
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          RELEASE_CHANGED_FILES: ${{ runner.temp }}/release-changed-files.json
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const payload = {
              expectedFileCount: context.payload.pull_request.changed_files,
              files: files.map(({ filename, previous_filename }) => ({
                filename,
                ...(previous_filename ? { previous_filename } : {}),
              })),
            };
            await require('node:fs/promises').writeFile(
              process.env.RELEASE_CHANGED_FILES,
              JSON.stringify(payload),
            );

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc

      - name: Validate release bump label
        env:
          RELEASE_CHANGED_FILES: ${{ runner.temp }}/release-changed-files.json
        run: |
          node scripts/release/resolve-release-bump-from-pr.mjs \
            --event "${GITHUB_EVENT_PATH}" \
            --changed-files "${RELEASE_CHANGED_FILES}"
