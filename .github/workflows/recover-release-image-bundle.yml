name: Recover Release Image Bundle

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Existing 40-character release commit SHA
        required: true
        type: string
      release_tag:
        description: Existing release tag to repair (vX.Y.Z)
        required: true
        type: string
      previous_tag:
        description: Complete prior release tag used for unchanged images
        required: true
        type: string
      reuse_batch_backend:
        description: Copy batch-backend from the previous release
        required: true
        default: false
        type: boolean
      reuse_batch_frontend:
        description: Copy batch-frontend from the previous release
        required: true
        default: false
        type: boolean
      reuse_telegram_ops_bot:
        description: Copy telegram-ops-bot from the previous release
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: recover-release-image-bundle-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish-images:
    name: publish production images
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      PREVIOUS_TAG: ${{ inputs.previous_tag }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc

      - name: Verify release ref
        run: |
          set -euo pipefail

          git fetch origin main:refs/remotes/origin/main --no-tags
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release commit is not a 40-character SHA: ${RELEASE_SHA}"
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag is not a vX.Y.Z tag: ${RELEASE_TAG}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "Release commit ${RELEASE_SHA} is not reachable from origin/main"
            exit 1
          fi
          if [[ "$RELEASE_SHA/$RELEASE_TAG/$PREVIOUS_TAG" != "abf52805439309cc91d733540b780ec3dcde4022/v23.2.3/v23.2.2" ]]; then
            echo "Unexpected release recovery target"
            exit 1
          fi
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          if [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$RELEASE_SHA" ]]; then
            echo "Release tag does not match release SHA"
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          if [[ "v${package_version}" != "$RELEASE_TAG" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match package.json version ${package_version}"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: packages/batch-backend/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_PREFIX }}/batch-backend:${{ env.RELEASE_SHA }}
            ${{ env.IMAGE_PREFIX }}/batch-backend:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=batch-backend

      - name: Build and publish frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: packages/batch-frontend/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_PREFIX }}/batch-frontend:${{ env.RELEASE_SHA }}
            ${{ env.IMAGE_PREFIX }}/batch-frontend:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=batch-frontend

      - name: Reuse unchanged production images
        env:
          BUILD_BACKEND: 'true'
          BUILD_FRONTEND: 'true'
          BUILD_BOT: 'false'
        run: |
          set -euo pipefail

          reuse_image() {
            local name="$1"
            docker buildx imagetools create \
              --prefer-index=false \
              --tag "${IMAGE_PREFIX}/${name}:${RELEASE_SHA}" \
              --tag "${IMAGE_PREFIX}/${name}:${RELEASE_TAG}" \
              "${IMAGE_PREFIX}/${name}:${PREVIOUS_TAG}"
          }

          [[ "$BUILD_BACKEND" == "true" ]] || reuse_image batch-backend
          [[ "$BUILD_FRONTEND" == "true" ]] || reuse_image batch-frontend
          [[ "$BUILD_BOT" == "true" ]] || reuse_image telegram-ops-bot

      - name: Verify all published digests
        run: |
          set -euo pipefail
          for image in batch-backend batch-frontend telegram-ops-bot; do
            sha_digest="$(docker buildx imagetools inspect "$IMAGE_PREFIX/$image:$RELEASE_SHA" | awk '$1 == "Digest:" { print $2 }')"
            tag_digest="$(docker buildx imagetools inspect "$IMAGE_PREFIX/$image:$RELEASE_TAG" | awk '$1 == "Digest:" { print $2 }')"
            if [[ ! "$sha_digest" =~ ^sha256:[0-9a-f]{64}$ || "$sha_digest" != "$tag_digest" ]]; then
              echo "Release refs for $image do not resolve to the same digest"
              exit 1
            fi
            echo "Verified $image at $sha_digest"
          done

      - name: Record published release images
        run: |
          {
            printf '### Published release images\n\n'
            printf 'Release: %s\n\nPublished release SHA: %s\n\n' "$RELEASE_TAG" "$RELEASE_SHA"
            for image in batch-backend batch-frontend telegram-ops-bot; do
              printf -- '- %s/%s:%s\n' "$IMAGE_PREFIX" "$image" "$RELEASE_SHA"
            done
          } >> "$GITHUB_STEP_SUMMARY"
