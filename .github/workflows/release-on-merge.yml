name: Release On Merge

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  packages: write
  pull-requests: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-decision:
    name: resolve release publication
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      should_release: ${{ steps.policy.outputs.should_release }}
      build_backend: ${{ steps.image_scope.outputs.build_backend }}
      build_frontend: ${{ steps.image_scope.outputs.build_frontend }}
      build_bot: ${{ steps.image_scope.outputs.build_bot }}
    steps:
      - name: Collect release policy file records
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          RELEASE_CHANGED_FILES: ${{ runner.temp }}/release-changed-files.json
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const payload = {
              expectedFileCount: context.payload.pull_request.changed_files,
              files: files.map(({ filename, previous_filename }) => ({
                filename,
                ...(previous_filename ? { previous_filename } : {}),
              })),
            };
            await require('node:fs/promises').writeFile(
              process.env.RELEASE_CHANGED_FILES,
              JSON.stringify(payload),
            );

      - name: Checkout trusted main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc

      - name: Resolve release policy
        id: policy
        shell: bash
        env:
          RELEASE_CHANGED_FILES: ${{ runner.temp }}/release-changed-files.json
        run: |
          set -euo pipefail
          decision="$(node scripts/release/resolve-release-bump-from-pr.mjs \
            --event "${GITHUB_EVENT_PATH}" \
            --changed-files "${RELEASE_CHANGED_FILES}" \
            --json)"
          should_release="$(node -e \
            'const value = JSON.parse(process.argv[1]); process.stdout.write(String(value.releaseRequired));' \
            "$decision")"
          if [[ "$should_release" != "true" && "$should_release" != "false" ]]; then
            echo "Invalid release decision: $should_release"
            exit 1
          fi
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"

      - name: Resolve production image scope
        id: image_scope
        shell: bash
        env:
          RELEASE_CHANGED_FILES: ${{ runner.temp }}/release-changed-files.json
        run: |
          node scripts/release/resolve-production-image-scope.mjs \
            --changed-files "${RELEASE_CHANGED_FILES}" \
            --github-output "${GITHUB_OUTPUT}" \
            --summary "${GITHUB_STEP_SUMMARY}"

  release:
    name: release + tag
    needs: release-decision
    if: github.event.pull_request.merged == true && needs.release-decision.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      release_sha: ${{ steps.release_ref.outputs.sha }}
      release_tag: ${{ steps.release_ref.outputs.tag }}
      previous_tag: ${{ steps.release_ref.outputs.previous_tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc

      - name: Resolve release bump
        id: bump
        run: |
          BUMP="$(node scripts/release/resolve-release-bump-from-pr.mjs --event "${GITHUB_EVENT_PATH}")"
          echo "bump=${BUMP}" >> "$GITHUB_OUTPUT"

      - name: Compute next version
        id: next
        run: |
          CURRENT="$(node -p "require('./package.json').version")"
          NEXT="$(node scripts/release/compute-next-version.mjs --current "$CURRENT" --bump "${{ steps.bump.outputs.bump }}")"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "next=${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag is new
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.next.outputs.next }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.next.outputs.next }} already exists"
            exit 1
          fi

      - name: Update package.json and CHANGELOG
        run: |
          node scripts/release/write-release-files.mjs \
            --event "${GITHUB_EVENT_PATH}" \
            --version "${{ steps.next.outputs.next }}"

      - name: Commit release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No release file changes detected"
            exit 1
          fi
          git commit -m "chore(release): v${{ steps.next.outputs.next }}"

      - name: Rebase on latest main and push release commit
        run: |
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Failed to push release commit to main after retries"
          exit 1

      - name: Create and push release tag
        run: |
          git tag -a "v${{ steps.next.outputs.next }}" -m "Release v${{ steps.next.outputs.next }}"
          git push origin "v${{ steps.next.outputs.next }}"

      - name: Expose release image refs
        id: release_ref
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release commit resolved to invalid SHA: ${release_sha}"
            exit 1
          fi
          {
            echo "sha=${release_sha}"
            echo "tag=v${{ steps.next.outputs.next }}"
            echo "previous_tag=v${{ steps.next.outputs.current }}"
          } >> "$GITHUB_OUTPUT"

  publish-images:
    name: publish production images
    needs: [release-decision, release]
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository }}
      RELEASE_SHA: ${{ needs.release.outputs.release_sha }}
      RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
      PREVIOUS_TAG: ${{ needs.release.outputs.previous_tag }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.release.outputs.release_sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc

      - name: Verify release ref
        run: |
          set -euo pipefail

          git fetch origin main:refs/remotes/origin/main --no-tags
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release commit is not a 40-character SHA: ${RELEASE_SHA}"
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag is not a vX.Y.Z tag: ${RELEASE_TAG}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "Release commit ${RELEASE_SHA} is not reachable from origin/main"
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          if [[ "v${package_version}" != "$RELEASE_TAG" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match package.json version ${package_version}"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish backend
        if: needs.release-decision.outputs.build_backend == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: packages/batch-backend/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_PREFIX }}/batch-backend:${{ env.RELEASE_SHA }}
            ${{ env.IMAGE_PREFIX }}/batch-backend:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=batch-backend
          cache-to: type=gha,mode=max,scope=batch-backend,ignore-error=true

      - name: Build and publish frontend
        if: needs.release-decision.outputs.build_frontend == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: packages/batch-frontend/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_PREFIX }}/batch-frontend:${{ env.RELEASE_SHA }}
            ${{ env.IMAGE_PREFIX }}/batch-frontend:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=batch-frontend
          cache-to: type=gha,mode=max,scope=batch-frontend,ignore-error=true

      - name: Build and publish Telegram bot
        if: needs.release-decision.outputs.build_bot == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: packages/telegram-ops-bot/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_PREFIX }}/telegram-ops-bot:${{ env.RELEASE_SHA }}
            ${{ env.IMAGE_PREFIX }}/telegram-ops-bot:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=telegram-ops-bot
          cache-to: type=gha,mode=max,scope=telegram-ops-bot,ignore-error=true

      - name: Reuse unchanged production images
        env:
          BUILD_BACKEND: ${{ needs.release-decision.outputs.build_backend }}
          BUILD_FRONTEND: ${{ needs.release-decision.outputs.build_frontend }}
          BUILD_BOT: ${{ needs.release-decision.outputs.build_bot }}
        run: |
          set -euo pipefail

          reuse_image() {
            local name="$1"
            docker buildx imagetools create \
              --prefer-index=false \
              --tag "${IMAGE_PREFIX}/${name}:${RELEASE_SHA}" \
              --tag "${IMAGE_PREFIX}/${name}:${RELEASE_TAG}" \
              "${IMAGE_PREFIX}/${name}:${PREVIOUS_TAG}"
          }

          [[ "$BUILD_BACKEND" == "true" ]] || reuse_image batch-backend
          [[ "$BUILD_FRONTEND" == "true" ]] || reuse_image batch-frontend
          [[ "$BUILD_BOT" == "true" ]] || reuse_image telegram-ops-bot
