name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    name: change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      integration: ${{ steps.scope.outputs.integration }}
      backend_db_worker: ${{ steps.scope.outputs.backend_db_worker }}
      telegram: ${{ steps.scope.outputs.telegram }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      maintenance_only: ${{ steps.scope.outputs.maintenance_only }}
      production_backend: ${{ steps.projection.outputs.production_backend }}
    steps:
      - name: Checkout
        # actions/checkout v6
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Setup Node
        # actions/setup-node v6
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc

      - name: Bootstrap conservative scope
        id: bootstrap
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          force_all=false
          # ci-bootstrap:start
          while IFS= read -r -d '' status; do
            path_count=1
            if [[ "$status" == R* || "$status" == C* ]]; then
              path_count=2
            fi
            for ((index = 0; index < path_count; index += 1)); do
              IFS= read -r -d '' changed_path
              case "$changed_path" in
                .github/workflows/*|scripts/check/*|.nvmrc|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|turbo.json|biome.json|vitest.config.*|tsconfig*.json)
                  force_all=true
                  ;;
              esac
            done
          done < <(git diff --name-status -z --find-renames --find-copies --diff-filter=ACDMRTUXB "$BASE_SHA...$HEAD_SHA")
          # ci-bootstrap:end
          echo "force_all=$force_all" >> "$GITHUB_OUTPUT"

      - name: Project hosted scope
        id: projection
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/check/run-ci-scope.mjs \
            --from "$BASE_SHA" \
            --to "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Combine bootstrap and projection
        id: scope
        shell: bash
        env:
          FORCE_ALL: ${{ steps.bootstrap.outputs.force_all }}
          RUNTIME: ${{ steps.projection.outputs.runtime }}
          INTEGRATION: ${{ steps.projection.outputs.integration }}
          BACKEND_DB_WORKER: ${{ steps.projection.outputs.backend_db_worker }}
          TELEGRAM: ${{ steps.projection.outputs.telegram }}
          DOCS_ONLY: ${{ steps.projection.outputs.docs_only }}
          MAINTENANCE_ONLY: ${{ steps.projection.outputs.maintenance_only }}
        run: |
          set -euo pipefail
          if [[ "$FORCE_ALL" == true ]]; then
            printf '%s\n' runtime=true integration=true backend_db_worker=true telegram=true docs_only=false maintenance_only=false >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' \
              "runtime=$RUNTIME" \
              "integration=$INTEGRATION" \
              "backend_db_worker=$BACKEND_DB_WORKER" \
              "telegram=$TELEGRAM" \
              "docs_only=$DOCS_ONLY" \
              "maintenance_only=$MAINTENANCE_ONLY" >> "$GITHUB_OUTPUT"
          fi

  repository-policy:
    name: repository policy (node 24.x)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max_old_space_size=4096
    steps:
      - name: Checkout
        # actions/checkout v6
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Setup pnpm
        # pnpm/action-setup v6.1.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false

      - name: Setup Node
        # actions/setup-node v6
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Initialize repository policy logs
        run: mkdir -p tmp/ci-logs/repository-policy

      - name: Validate environment template
        id: env_template
        shell: bash
        run: |
          set -o pipefail
          pnpm env:validate:example 2>&1 | tee tmp/ci-logs/repository-policy/env-validate-example.log

      - name: Tooling tests
        id: tooling_tests
        shell: bash
        run: |
          set -o pipefail
          pnpm test:tooling 2>&1 | tee tmp/ci-logs/repository-policy/test-tooling.log

      - name: Verify repo hygiene tools
        shell: bash
        run: |
          set -euo pipefail
          command -v shellcheck
          shellcheck --version
          actionlint_version=1.7.11
          actionlint_archive="actionlint_${actionlint_version}_linux_amd64.tar.gz"
          actionlint_sha256=900919a84f2229bac68ca9cd4103ea297abc35e9689ebb842c6e34a3d1b01b0a
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${actionlint_version}/${actionlint_archive}" \
            --output "$RUNNER_TEMP/${actionlint_archive}"
          echo "${actionlint_sha256}  $RUNNER_TEMP/${actionlint_archive}" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/${actionlint_archive}" -C "$RUNNER_TEMP/actionlint-bin"
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"

      - name: Lint GitHub workflows
        id: lint_workflows
        shell: bash
        run: |
          set -o pipefail
          pnpm run lint:workflows 2>&1 | tee tmp/ci-logs/repository-policy/lint-workflows.log

      - name: Lint shell scripts
        id: lint_shell
        shell: bash
        run: |
          set -o pipefail
          pnpm run lint:shell 2>&1 | tee tmp/ci-logs/repository-policy/lint-shell.log

      - name: Lint Docker configuration
        id: docker_lint
        shell: bash
        run: |
          set -o pipefail
          pnpm docker:lint 2>&1 | tee tmp/ci-logs/repository-policy/docker-lint.log

      - name: Dependency audit
        id: dependency_audit
        shell: bash
        run: |
          set -o pipefail
          pnpm deps:audit:strict 2>&1 | tee tmp/ci-logs/repository-policy/deps-audit-strict.log

      - name: Contract version consistency
        id: contract_versions
        shell: bash
        run: |
          set -o pipefail
          pnpm release:verify:contracts 2>&1 | tee tmp/ci-logs/repository-policy/release-verify-contracts.log

      - name: Orchestrator boundary guardrails
        id: orchestrator_boundary
        shell: bash
        run: |
          set -o pipefail
          pnpm guard:orchestrator:boundary 2>&1 | tee tmp/ci-logs/repository-policy/guard-orchestrator-boundary.log

      - name: Docs sanity checks
        id: docs_sanity
        continue-on-error: true
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          pnpm docs:check:pr -- --from "$BASE_SHA" --to "$HEAD_SHA" 2>&1 | tee tmp/ci-logs/repository-policy/docs-check.log

      - name: Generate docs health report
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm docs:health:report -- --pr --from "$BASE_SHA" --to "$HEAD_SHA"

      - name: Upload docs health artifact on failure
        if: steps.docs_sanity.outcome == 'failure'
        # actions/upload-artifact v7.0.0
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: docs-health-report
          path: |
            tmp/docs-health-report.json
            tmp/docs-health-report.md
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if docs checks failed
        if: steps.docs_sanity.outcome == 'failure'
        run: |
          echo "Docs sanity checks failed. See docs-health-report artifact for details."
          exit 1

      - name: Write repository policy log manifest
        if: always()
        env:
          POLICY_RESULTS: >-
            [{"command":"pnpm env:validate:example","conclusion":"${{ steps.env_template.outcome }}","logPath":"tmp/ci-logs/repository-policy/env-validate-example.log"},{"command":"pnpm test:tooling","conclusion":"${{ steps.tooling_tests.outcome }}","logPath":"tmp/ci-logs/repository-policy/test-tooling.log"},{"command":"pnpm run lint:workflows","conclusion":"${{ steps.lint_workflows.outcome }}","logPath":"tmp/ci-logs/repository-policy/lint-workflows.log"},{"command":"pnpm run lint:shell","conclusion":"${{ steps.lint_shell.outcome }}","logPath":"tmp/ci-logs/repository-policy/lint-shell.log"},{"command":"pnpm docker:lint","conclusion":"${{ steps.docker_lint.outcome }}","logPath":"tmp/ci-logs/repository-policy/docker-lint.log"},{"command":"pnpm deps:audit:strict","conclusion":"${{ steps.dependency_audit.outcome }}","logPath":"tmp/ci-logs/repository-policy/deps-audit-strict.log"},{"command":"pnpm release:verify:contracts","conclusion":"${{ steps.contract_versions.outcome }}","logPath":"tmp/ci-logs/repository-policy/release-verify-contracts.log"},{"command":"pnpm guard:orchestrator:boundary","conclusion":"${{ steps.orchestrator_boundary.outcome }}","logPath":"tmp/ci-logs/repository-policy/guard-orchestrator-boundary.log"},{"command":"pnpm docs:check:pr","conclusion":"${{ steps.docs_sanity.outcome }}","logPath":"tmp/ci-logs/repository-policy/docs-check.log"}]
        run: |
          mkdir -p tmp/ci-logs/repository-policy
          node -e "require('node:fs').writeFileSync('tmp/ci-logs/repository-policy/manifest.json', JSON.stringify(JSON.parse(process.env.POLICY_RESULTS), null, 2) + '\n')"

      - name: Upload repository policy logs
        if: always()
        # actions/upload-artifact v7.0.0
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: repository-policy-logs
          path: tmp/ci-logs/repository-policy
          if-no-files-found: warn
          retention-days: 14

  build-code-quality:
    name: build + code quality (node 24.x)
    needs: change-scope
    if: ${{ fromJSON(needs.change-scope.outputs.runtime) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max_old_space_size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Initialize build and code quality logs
        run: mkdir -p tmp/ci-logs/build-code-quality

      - name: Build
        id: build
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee tmp/ci-logs/build-code-quality/build.log

      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee tmp/ci-logs/build-code-quality/typecheck.log

      - name: Lint
        id: lint
        if: always()
        shell: bash
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee tmp/ci-logs/build-code-quality/lint.log

      - name: Write build and code quality log manifest
        if: always()
        env:
          BUILD_RESULTS: >-
            [{"command":"pnpm build","conclusion":"${{ steps.build.outcome }}","logPath":"tmp/ci-logs/build-code-quality/build.log"},{"command":"pnpm typecheck","conclusion":"${{ steps.typecheck.outcome }}","logPath":"tmp/ci-logs/build-code-quality/typecheck.log"},{"command":"pnpm lint","conclusion":"${{ steps.lint.outcome }}","logPath":"tmp/ci-logs/build-code-quality/lint.log"}]
        run: |
          mkdir -p tmp/ci-logs/build-code-quality
          node -e "require('node:fs').writeFileSync('tmp/ci-logs/build-code-quality/manifest.json', JSON.stringify(JSON.parse(process.env.BUILD_RESULTS), null, 2) + '\n')"

      - name: Upload build and code quality logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: build-code-quality-logs
          path: tmp/ci-logs/build-code-quality
          if-no-files-found: warn
          retention-days: 14

  unit-component:
    name: unit + component (node 24.x)
    needs: change-scope
    if: ${{ fromJSON(needs.change-scope.outputs.runtime) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max_old_space_size=4096
      UNIT_WORKSPACE_CONCURRENCY: '2'
      UNIT_MAX_WORKERS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Initialize unit and component logs
        run: mkdir -p tmp/ci-logs/unit-component

      - name: Build test prerequisites
        id: build
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee tmp/ci-logs/unit-component/build.log

      - name: Display runner resources
        id: runner_resources
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "UNIT_WORKSPACE_CONCURRENCY=$UNIT_WORKSPACE_CONCURRENCY"
            echo "UNIT_MAX_WORKERS=$UNIT_MAX_WORKERS"
            echo "nproc=$(nproc)"
            free -h
            df -h "$GITHUB_WORKSPACE"
          } | tee tmp/ci-logs/unit-component/runner-resources.log

      - name: Unit and component tests
        id: unit_tests
        shell: bash
        run: |
          set -o pipefail
          node scripts/test/assert-test-unit-scripts.mjs
          /usr/bin/time -v -o tmp/ci-logs/unit-component/unit-resource-usage.txt \
            pnpm -r --parallel --workspace-concurrency="$UNIT_WORKSPACE_CONCURRENCY" \
              --filter "./packages/*" --if-present run test:unit:prebuilt \
              --maxWorkers="$UNIT_MAX_WORKERS" \
            2>&1 | tee tmp/ci-logs/unit-component/test-unit-prebuilt.log

      - name: Write unit and component log manifest
        if: always()
        env:
          UNIT_RESULTS: >-
            [{"command":"pnpm build","conclusion":"${{ steps.build.outcome }}","logPath":"tmp/ci-logs/unit-component/build.log"},{"command":"node scripts/test/assert-test-unit-scripts.mjs && pnpm -r --parallel --workspace-concurrency=$UNIT_WORKSPACE_CONCURRENCY --filter ./packages/* run test:unit:prebuilt --maxWorkers=$UNIT_MAX_WORKERS","conclusion":"${{ steps.unit_tests.outcome }}","logPath":"tmp/ci-logs/unit-component/test-unit-prebuilt.log"},{"command":"runner resource display","conclusion":"${{ steps.runner_resources.outcome }}","logPath":"tmp/ci-logs/unit-component/runner-resources.log"},{"command":"/usr/bin/time -v pnpm -r --workspace-concurrency=$UNIT_WORKSPACE_CONCURRENCY test:unit:prebuilt","conclusion":"${{ steps.unit_tests.outcome }}","logPath":"tmp/ci-logs/unit-component/unit-resource-usage.txt"}]
        run: |
          mkdir -p tmp/ci-logs/unit-component
          node -e "require('node:fs').writeFileSync('tmp/ci-logs/unit-component/manifest.json', JSON.stringify(JSON.parse(process.env.UNIT_RESULTS), null, 2) + '\n')"

      - name: Upload unit and component logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: unit-component-logs
          path: tmp/ci-logs/unit-component
          if-no-files-found: warn
          retention-days: 14

  deterministic-integration-media:
    name: deterministic integration + media (blocking)
    needs: change-scope
    if: ${{ fromJSON(needs.change-scope.outputs.integration) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max_old_space_size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Initialize deterministic integration and media logs
        run: mkdir -p tmp/ci-logs/deterministic-integration-media

      - name: Integration tests
        id: integration_tests
        shell: bash
        run: |
          set -o pipefail
          pnpm test:integration 2>&1 | tee tmp/ci-logs/deterministic-integration-media/test-integration.log

      - name: Install FFmpeg for recording media tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Backend recording media tests
        id: media_tests
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @esl-pipeline/batch-backend test:media 2>&1 | tee tmp/ci-logs/deterministic-integration-media/test-media.log

      - name: Write deterministic integration and media log manifest
        if: always()
        env:
          INTEGRATION_RESULTS: >-
            [{"command":"pnpm test:integration","conclusion":"${{ steps.integration_tests.outcome }}","logPath":"tmp/ci-logs/deterministic-integration-media/test-integration.log"},{"command":"pnpm --filter @esl-pipeline/batch-backend test:media","conclusion":"${{ steps.media_tests.outcome }}","logPath":"tmp/ci-logs/deterministic-integration-media/test-media.log"}]
        run: |
          mkdir -p tmp/ci-logs/deterministic-integration-media
          node -e "require('node:fs').writeFileSync('tmp/ci-logs/deterministic-integration-media/manifest.json', JSON.stringify(JSON.parse(process.env.INTEGRATION_RESULTS), null, 2) + '\n')"

      - name: Upload deterministic integration and media logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: deterministic-integration-media-logs
          path: tmp/ci-logs/deterministic-integration-media
          if-no-files-found: warn
          retention-days: 14

  backend-db-integration:
    name: backend db + worker integration (blocking)
    needs: change-scope
    if: ${{ fromJSON(needs.change-scope.outputs.backend_db_worker) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max_old_space_size=4096
      PG_ENABLED: 'true'
      PG_CONNECTION_STRING: postgresql://postgres:postgres@127.0.0.1:5432/esl_batch_test
      PG_AUTO_MIGRATE_ON_BOOT: 'false'
      PG_HOST: 127.0.0.1
      PG_PORT: '5432'
      PG_USER: postgres
      PG_PASSWORD: postgres
      PG_DATABASE: esl_batch_test
      REDIS_ENABLED: 'true'
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      BATCH_BACKEND_TEST_PG: postgresql://postgres:postgres@127.0.0.1:5432/esl_batch_test
      BATCH_BACKEND_TEST_REDIS: redis://127.0.0.1:6379
      BATCH_BACKEND_TEST_TIMEOUT_MS: '120000'
      BATCH_BACKEND_TEST_ARTIFACTS_DIR: ${{ github.workspace }}/.artifacts/backend-db-integration
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: esl_batch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d esl_batch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build backend package graph
        run: pnpm --filter @esl-pipeline/batch-backend... run build

      - name: Wait for Postgres and Redis
        run: |
          set -euo pipefail
          for _ in {1..30}; do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/5432'; then
              break
            fi
            sleep 2
          done
          timeout 1 bash -c '</dev/tcp/127.0.0.1/5432'
          for _ in {1..30}; do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/6379'; then
              break
            fi
            sleep 2
          done
          timeout 1 bash -c '</dev/tcp/127.0.0.1/6379'

      - name: Migration preflight
        run: |
          set -euo pipefail
          mkdir -p "$BATCH_BACKEND_TEST_ARTIFACTS_DIR"
          pnpm --filter @esl-pipeline/batch-backend db:migrate 2>&1 | tee "$BATCH_BACKEND_TEST_ARTIFACTS_DIR/db-migrate.log"
          pnpm --filter @esl-pipeline/batch-backend db:status 2>&1 | tee "$BATCH_BACKEND_TEST_ARTIFACTS_DIR/db-status.log"
          pnpm --filter @esl-pipeline/batch-backend db:verify 2>&1 | tee "$BATCH_BACKEND_TEST_ARTIFACTS_DIR/db-verify.log"
          pnpm --filter @esl-pipeline/batch-backend db:verify-baseline 2>&1 | tee "$BATCH_BACKEND_TEST_ARTIFACTS_DIR/db-verify-baseline.log"

      - name: Migration matrix tests
        run: |
          set -euo pipefail
          pnpm --filter @esl-pipeline/batch-backend test:db:migrations 2>&1 | tee "$BATCH_BACKEND_TEST_ARTIFACTS_DIR/test-db-migrations.log"

      - name: Postgres integration and query plan tests
        run: |
          set -euo pipefail
          pnpm --filter @esl-pipeline/batch-backend test:db:postgres 2>&1 | tee "$BATCH_BACKEND_TEST_ARTIFACTS_DIR/test-db-postgres.log"

      - name: Worker integration tests
        run: |
          set -euo pipefail
          pnpm --filter @esl-pipeline/batch-backend test:integration:worker 2>&1 | tee "$BATCH_BACKEND_TEST_ARTIFACTS_DIR/test-worker-integration.log"

      - name: Capture schema snapshot on failure
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p "$BATCH_BACKEND_TEST_ARTIFACTS_DIR"
          postgres_container_id="$(docker ps --filter "ancestor=postgres:18" --format '{{.ID}}' | head -n1)"
          if [[ -n "$postgres_container_id" ]]; then
            docker exec "$postgres_container_id" sh -lc \
              'PGPASSWORD=postgres pg_dump --schema-only --username postgres --dbname esl_batch_test' \
              > "$BATCH_BACKEND_TEST_ARTIFACTS_DIR/schema.sql" \
              || printf '%s\n' 'schema snapshot failed inside postgres:18 service container' \
                > "$BATCH_BACKEND_TEST_ARTIFACTS_DIR/schema-snapshot-note.txt"
          else
            printf '%s\n' 'schema snapshot skipped: postgres:18 service container was not found' \
              > "$BATCH_BACKEND_TEST_ARTIFACTS_DIR/schema-snapshot-note.txt"
          fi

      - name: Upload backend db + worker artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: backend-db-integration-artifacts
          path: ${{ github.workspace }}/.artifacts/backend-db-integration
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  telegram-compose-smoke:
    name: telegram command-loop compose smoke
    needs: change-scope
    if: ${{ fromJSON(needs.change-scope.outputs.telegram) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TELEGRAM_SMOKE_ARTIFACT_DIR: ${{ github.workspace }}/.artifacts/telegram-compose-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Docker compose version
        run: docker compose version

      - name: Run Telegram compose smoke workflow
        run: bash scripts/smoke/run-telegram-ops-compose-smoke.sh

      - name: Upload Telegram compose smoke artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: telegram-compose-smoke-artifacts
          path: ${{ github.workspace }}/.artifacts/telegram-compose-smoke
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  production-backend-packaging:
    name: production backend packaging
    needs: change-scope
    if: ${{ fromJSON(needs.change-scope.outputs.production_backend) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build production backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: packages/batch-backend/Dockerfile
          platforms: linux/amd64
          pull: true
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=pr-batch-backend
          cache-to: type=gha,mode=max,scope=pr-batch-backend,ignore-error=true

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs:
      - change-scope
      - repository-policy
      - build-code-quality
      - unit-component
      - deterministic-integration-media
      - backend-db-integration
      - telegram-compose-smoke
      - production-backend-packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Evaluate required CI results
        env:
          CI_RESULTS: >-
            {"change-scope":"${{ needs.change-scope.result }}","repository-policy":"${{ needs.repository-policy.result }}","build-code-quality":"${{ needs.build-code-quality.result }}","unit-component":"${{ needs.unit-component.result }}","deterministic-integration-media":"${{ needs.deterministic-integration-media.result }}","backend-db-integration":"${{ needs.backend-db-integration.result }}","telegram-compose-smoke":"${{ needs.telegram-compose-smoke.result }}","production-backend-packaging":"${{ needs.production-backend-packaging.result }}"}
          CI_SCOPES: >-
            {"runtime":"${{ needs.change-scope.outputs.runtime }}","integration":"${{ needs.change-scope.outputs.integration }}","backend_db_worker":"${{ needs.change-scope.outputs.backend_db_worker }}","telegram":"${{ needs.change-scope.outputs.telegram }}","production_backend":"${{ needs.change-scope.outputs.production_backend }}"}
        run: |
          node <<'NODE'
          // ci-gate-evaluator:start
          const results = JSON.parse(process.env.CI_RESULTS);
          const scopes = JSON.parse(process.env.CI_SCOPES);
          const required = ['change-scope', 'repository-policy'];
          const conditional = {
            'build-code-quality': 'runtime',
            'unit-component': 'runtime',
            'deterministic-integration-media': 'integration',
            'backend-db-integration': 'backend_db_worker',
            'telegram-compose-smoke': 'telegram',
            'production-backend-packaging': 'production_backend',
          };
          const failures = [];
          for (const job of required) {
            if (results[job] !== 'success') failures.push(`${job}:${results[job]}`);
          }
          for (const [job, scope] of Object.entries(conditional)) {
            const selected = scopes[scope] === 'true';
            const result = results[job];
            if (selected ? result !== 'success' : !['success', 'skipped'].includes(result)) {
              failures.push(`${job}:${result}:selected=${selected}`);
            }
          }
          if (failures.length > 0) {
            console.error(`CI gate failed: ${failures.join(', ')}`);
            process.exit(1);
          }
          console.log('CI gate passed');
          // ci-gate-evaluator:end
          NODE
