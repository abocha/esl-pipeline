name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build (node 24.x)
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max_old_space_size=4096
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Enable Corepack & pin pnpm from package.json
        run: |
          corepack enable
          pnpm -v

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Prepare Docker disk space
        run: docker system prune --all --force || true

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit & integration tests
        run: pnpm test

      - name: Orchestrator targeted tests
        run: pnpm --filter @esl-pipeline/orchestrator test -- --runInBand
