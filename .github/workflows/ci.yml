name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: static checks (node 24.x)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max_old_space_size=4096
    steps:
      - name: Checkout
        # actions/checkout v6
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Setup pnpm
        # pnpm/action-setup v6.0.9
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          run_install: false

      - name: Setup Node
        # actions/setup-node v6
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Validate environment template
        run: pnpm env:validate:example

      - name: Install repo hygiene tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.11/actionlint_1.7.11_linux_amd64.tar.gz \
            | tar -xzf - -C "$RUNNER_TEMP/actionlint-bin"
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"

      - name: Lint GitHub workflows
        run: pnpm run lint:workflows

      - name: Lint shell scripts
        run: pnpm run lint:shell

      - name: Lint Docker Compose files
        run: pnpm docker:lint

      - name: Dependency audit
        run: pnpm deps:audit:strict

      - name: Contract version consistency
        run: pnpm release:verify:contracts

      - name: Orchestrator boundary guardrails
        run: pnpm guard:orchestrator:boundary

      - name: Docs sanity checks
        id: docs_sanity
        continue-on-error: true
        run: pnpm docs:check

      - name: Generate docs health report
        if: always()
        run: pnpm docs:health:report

      - name: Upload docs health artifact on failure
        if: steps.docs_sanity.outcome == 'failure'
        # actions/upload-artifact v7.0.0
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: docs-health-report
          path: |
            tmp/docs-health-report.json
            tmp/docs-health-report.md
          if-no-files-found: warn

      - name: Fail if docs checks failed
        if: steps.docs_sanity.outcome == 'failure'
        run: |
          echo "Docs sanity checks failed. See docs-health-report artifact for details."
          exit 1

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit:prebuilt

  coverage-report:
    name: coverage report (non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    env:
      NODE_OPTIONS: --max_old_space_size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run core unit coverage
        continue-on-error: true
        run: pnpm test:coverage:core

      - name: Generate coverage report
        if: always()
        run: pnpm test:coverage:report

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: coverage-report
          path: tmp/coverage
          if-no-files-found: warn

  unit-timings:
    name: unit timings (non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    env:
      NODE_OPTIONS: --max_old_space_size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run unit timings
        continue-on-error: true
        run: pnpm test:timings:unit

      - name: Generate unit timing report
        if: always()
        run: pnpm test:timings:report

      - name: Upload unit timing artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: unit-timings
          path: tmp/test-timings
          if-no-files-found: warn

  integration-tests:
    name: integration lane (blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max_old_space_size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Integration tests
        run: pnpm test:integration

  backend-db-integration:
    name: backend db + worker integration (blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max_old_space_size=4096
      PG_ENABLED: 'true'
      PG_CONNECTION_STRING: postgresql://postgres:postgres@127.0.0.1:5432/esl_batch_test
      PG_AUTO_MIGRATE_ON_BOOT: 'false'
      PG_HOST: 127.0.0.1
      PG_PORT: '5432'
      PG_USER: postgres
      PG_PASSWORD: postgres
      PG_DATABASE: esl_batch_test
      REDIS_ENABLED: 'true'
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      BATCH_BACKEND_TEST_PG: postgresql://postgres:postgres@127.0.0.1:5432/esl_batch_test
      BATCH_BACKEND_TEST_REDIS: redis://127.0.0.1:6379
      BATCH_BACKEND_TEST_TIMEOUT_MS: '120000'
      BATCH_BACKEND_TEST_ARTIFACTS_DIR: ${{ github.workspace }}/.artifacts/backend-db-integration
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: esl_batch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d esl_batch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build backend package graph
        run: pnpm --filter @esl-pipeline/batch-backend... run build

      - name: Wait for Postgres and Redis
        run: |
          set -euo pipefail
          for _ in {1..30}; do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/5432'; then
              break
            fi
            sleep 2
          done
          timeout 1 bash -c '</dev/tcp/127.0.0.1/5432'
          for _ in {1..30}; do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/6379'; then
              break
            fi
            sleep 2
          done
          timeout 1 bash -c '</dev/tcp/127.0.0.1/6379'

      - name: Migration preflight
        run: |
          set -euo pipefail
          mkdir -p "$BATCH_BACKEND_TEST_ARTIFACTS_DIR"
          pnpm --filter @esl-pipeline/batch-backend db:migrate 2>&1 | tee "$BATCH_BACKEND_TEST_ARTIFACTS_DIR/db-migrate.log"
          pnpm --filter @esl-pipeline/batch-backend db:status 2>&1 | tee "$BATCH_BACKEND_TEST_ARTIFACTS_DIR/db-status.log"
          pnpm --filter @esl-pipeline/batch-backend db:verify 2>&1 | tee "$BATCH_BACKEND_TEST_ARTIFACTS_DIR/db-verify.log"
          pnpm --filter @esl-pipeline/batch-backend db:verify-baseline 2>&1 | tee "$BATCH_BACKEND_TEST_ARTIFACTS_DIR/db-verify-baseline.log"

      - name: Migration matrix tests
        run: |
          set -euo pipefail
          pnpm --filter @esl-pipeline/batch-backend test:db:migrations 2>&1 | tee "$BATCH_BACKEND_TEST_ARTIFACTS_DIR/test-db-migrations.log"

      - name: Postgres integration and query plan tests
        run: |
          set -euo pipefail
          pnpm --filter @esl-pipeline/batch-backend test:db:postgres 2>&1 | tee "$BATCH_BACKEND_TEST_ARTIFACTS_DIR/test-db-postgres.log"

      - name: Worker integration tests
        run: |
          set -euo pipefail
          pnpm --filter @esl-pipeline/batch-backend test:integration:worker 2>&1 | tee "$BATCH_BACKEND_TEST_ARTIFACTS_DIR/test-worker-integration.log"

      - name: Capture schema snapshot on failure
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p "$BATCH_BACKEND_TEST_ARTIFACTS_DIR"
          postgres_container_id="$(docker ps --filter "ancestor=postgres:18" --format '{{.ID}}' | head -n1)"
          if [[ -n "$postgres_container_id" ]]; then
            docker exec "$postgres_container_id" sh -lc \
              'PGPASSWORD=postgres pg_dump --schema-only --username postgres --dbname esl_batch_test' \
              > "$BATCH_BACKEND_TEST_ARTIFACTS_DIR/schema.sql" \
              || printf '%s\n' 'schema snapshot failed inside postgres:18 service container' \
                > "$BATCH_BACKEND_TEST_ARTIFACTS_DIR/schema-snapshot-note.txt"
          else
            printf '%s\n' 'schema snapshot skipped: postgres:18 service container was not found' \
              > "$BATCH_BACKEND_TEST_ARTIFACTS_DIR/schema-snapshot-note.txt"
          fi

      - name: Upload backend db + worker artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: backend-db-integration-artifacts
          path: ${{ github.workspace }}/.artifacts/backend-db-integration
          include-hidden-files: true
          if-no-files-found: warn

  telegram-compose-smoke:
    name: telegram command-loop compose smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TELEGRAM_SMOKE_ARTIFACT_DIR: ${{ github.workspace }}/.artifacts/telegram-compose-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Docker compose version
        run: docker compose version

      - name: Run Telegram compose smoke workflow
        run: bash scripts/smoke/run-telegram-ops-compose-smoke.sh

      - name: Upload Telegram compose smoke artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: telegram-compose-smoke-artifacts
          path: ${{ github.workspace }}/.artifacts/telegram-compose-smoke
          include-hidden-files: true
          if-no-files-found: warn
