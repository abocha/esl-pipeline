name: Docs Gardening

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: docs-gardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-gardening:
    name: docs gardening
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Docs checks
        id: docs_checks
        continue-on-error: true
        run: pnpm docs:check

      - name: Generate docs health report
        if: always()
        run: pnpm docs:health:report

      - name: Find stale active docs
        if: always()
        run: pnpm docs:stale:active

      - name: Upload docs gardening artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docs-gardening-artifacts
          path: |
            tmp/docs-health-report.json
            tmp/docs-health-report.md
            tmp/docs-stale-active.json
            tmp/docs-stale-active.md
          if-no-files-found: warn

      - name: Open or update rolling docs-gardening issue
        if: always()
        uses: actions/github-script@v7
        env:
          DOCS_CHECK_OUTCOME: ${{ steps.docs_checks.outcome }}
        with:
          script: |
            const fs = require('node:fs');

            const title = 'docs-gardening';
            const reportPath = 'tmp/docs-health-report.md';
            const stalePath = 'tmp/docs-stale-active.md';

            const report = fs.existsSync(reportPath) ? fs.readFileSync(reportPath, 'utf8') : 'missing docs health report';
            const stale = fs.existsSync(stalePath) ? fs.readFileSync(stalePath, 'utf8') : 'missing stale docs report';

            const checksFailed = process.env.DOCS_CHECK_OUTCOME === 'failure';
            const hasErrors = /- Errors:\s+[1-9]/.test(report);
            const hasWarnings = /- Warnings:\s+[1-9]/.test(report);
            const hasCandidates = /\|\s+docs\//.test(stale);

            if (!checksFailed && !hasErrors && !hasWarnings && !hasCandidates) {
              core.info('No docs-gardening findings. Skipping issue update.');
              return;
            }

            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const summary = [
              'Automated docs-gardening run found actionable items.',
              '',
              `- Run: ${runUrl}`,
              `- docs:check outcome: ${process.env.DOCS_CHECK_OUTCOME}`,
              `- docs health warnings present: ${hasWarnings}`,
              '',
              '## Actionable Checklist',
              '',
              '- [ ] Fix broken links and routing edge failures from report.',
              '- [ ] Fix metadata/freshness violations from report.',
              '- [ ] Triage stale-active candidates (archive/update/relink).',
              '- [ ] Re-run `pnpm docs:check && pnpm docs:health:report` locally.',
              '',
              '## Docs Health Report',
              '',
              report,
              '',
              '## Stale Active Docs Candidates',
              '',
              stale,
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            const existing = issues.find((issue) => issue.title === title);

            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: summary,
              });
              core.info('Created new docs-gardening issue.');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: summary,
            });
            core.info(`Updated docs-gardening issue #${existing.number}.`);

      - name: Fail workflow if docs checks failed
        if: steps.docs_checks.outcome == 'failure'
        run: |
          echo "Docs checks failed during docs-gardening run."
          exit 1
