name: Docs Gardening

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: docs-gardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-gardening:
    name: docs gardening
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Setup pnpm
        # pnpm/action-setup v6.0.9
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Generate docs gardening artifacts
        run: pnpm docs:garden

      - name: Upload docs gardening artifacts
        if: always()
        # actions/upload-artifact v7.0.0
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: docs-gardening-artifacts
          path: |
            tmp/docs-gardening.json
            tmp/docs-gardening-issue.json
            tmp/docs-gardening-issue.md
            tmp/docs-health-report.json
            tmp/docs-health-report.md
            tmp/docs-plan-lifecycle.json
            tmp/docs-plan-lifecycle.md
            tmp/docs-stale-active.json
            tmp/docs-stale-active.md
          if-no-files-found: warn
          retention-days: 30

      - name: Update rolling docs-gardening issue
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const fs = require('node:fs');
            const issuePath = 'tmp/docs-gardening-issue.json';
            if (!fs.existsSync(issuePath)) {
              core.setFailed(`Missing docs gardening issue artifact: ${issuePath}`);
              return;
            }

            const issue = JSON.parse(fs.readFileSync(issuePath, 'utf8'));
            const title = issue.title ?? 'docs-gardening';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = `${issue.body.trimEnd()}\n\n## Run\n\n- ${runUrl}\n`;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);

            if (issue.action === 'close') {
              if (!existing) {
                core.info('No existing docs-gardening issue to close.');
                return;
              }

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
                state: 'closed',
              });
              core.info(`Closed docs-gardening issue #${existing.number}.`);
              return;
            }

            if (issue.action !== 'create-or-update') {
              core.info(`No docs-gardening issue action required: ${issue.action}`);
              return;
            }

            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
              core.info('Created new docs-gardening issue.');
              return;
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body,
              state: 'open',
            });
            core.info(`Updated docs-gardening issue #${existing.number}.`);

      - name: Fail workflow if hard gates failed
        if: always()
        run: |
          node -e "const fs=require('node:fs');const report=JSON.parse(fs.readFileSync('tmp/docs-gardening.json','utf8')); if(report.summary?.status==='failing'){console.error('Docs gardening hard gates failed.'); process.exit(1);}"
